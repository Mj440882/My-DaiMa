        ];
        
        function renderGames(gameList) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            if (gameList.length === 0) {
                grid.innerHTML = '<div class="no-results">未找到匹配的游戏</div>';
                return;
            }
            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openModal(game);
                const imageUrl = validateImageURL(game.image) ? game.image : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 170%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22170%22/%3E%3Ctext x=%22150%22 y=%2285%22 text-anchor=%22middle%22 fill=%22%23e94560%22 font-size=%2220%22%3E游戏封面%3C/text%3E%3C/svg%3E';
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${sanitizeHTML(game.name)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 170%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22170%22/%3E%3Ctext x=%22150%22 y=%2285%22 text-anchor=%22middle%22 fill=%22%23e94560%22 font-size=%2220%22%3E游戏封面%3C/text%3E%3C/svg%3E'">
                    <div class="game-card-content">
                        <h3>${sanitizeHTML(game.name)}</h3>
                        <p class="name-en">${sanitizeHTML(game.nameEn)}</p>
                        <p class="brand">${sanitizeHTML(game.brand)}</p>
                        <div class="prices-row">
                            <div class="price-item-small"><span class="platform">Steam</span><span class="prices"><span class="original">¥${game.prices.steamOriginal}</span><span class="current">¥${game.prices.steam}</span></span></div>
                            <div class="price-item-small"><span class="platform">EPIC</span><span class="prices">${game.prices.epic === '暂无' ? '<span class="current">暂无</span>' : `<span class="original">¥${game.prices.epicOriginal}</span><span class="current">¥${game.prices.epic}</span>`}</span></div>
                            <div class="price-item-small"><span class="platform">SteamPY</span><span class="prices"><span class="original">¥${game.prices.steampyOriginal}</span><span class="current">¥${game.prices.steampy}</span></span></div>
                            <div class="price-item-small"><span class="platform">CICI</span><span class="prices"><span class="original">¥${game.prices.steamciciOriginal}</span><span class="current">¥${game.prices.steamcici}</span></span></div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('totalCount').textContent = `共收录 ${gameList.length} 款游戏`;
        }
        
        function openModal(game) {
            document.getElementById('modalGameImage').src = validateImageURL(game.image) ? game.image : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 170%22%3E%3Crect fill=%22%231a1a2e%22 width=%22300%22 height=%22170%22/%3E%3Ctext x=%22150%22 y=%2285%22 text-anchor=%22middle%22 fill=%22%23e94560%22 font-size=%2220%22%3E游戏封面%3C/text%3E%3C/svg%3E';
            document.getElementById('modalGameName').textContent = game.name;
            document.getElementById('modalGameNameEn').textContent = game.nameEn;
            document.getElementById('modalGameBrand').textContent = game.brand;
            document.getElementById('modalGameDesc').textContent = game.description;
            
            const platforms = [
                { name: 'Steam', key: 'steam' },
                { name: 'EPIC', key: 'epic' },
                { name: 'SteamPY', key: 'steampy' },
                { name: 'SteamCICI', key: 'steamcici' }
            ];
            
            let priceHTML = '';
            platforms.forEach(platform => {
                const price = game.prices[platform.key];
                const original = game.prices[`${platform.key}Original`];
                const link = game.prices[`${platform.key}Link`];
                const isValidLink = validateURL(link);
                priceHTML += `
                    <div class="price-item">
                        <div class="platform">${sanitizeHTML(platform.name)}</div>
                        ${price === '暂无' ? '<div class="price-value">暂无</div>' : `<div class="price-value">¥${price}</div><div class="price-original">¥${original}</div>`}
                        ${isValidLink ? `<a href="${link}" class="buy-btn" target="_blank" rel="noopener noreferrer">立即购买</a>` : ''}
                    </div>
                `;
            });
            document.getElementById('priceComparison').innerHTML = priceHTML;
            
            const specsGrid = document.getElementById('specsGrid');
            specsGrid.innerHTML = `
                <div class="spec-item"><div class="spec-label">类型</div><div class="spec-value">${sanitizeHTML(game.specs.genre)}</div></div>
                <div class="spec-item"><div class="spec-label">发售日期</div><div class="spec-value">${sanitizeHTML(game.specs.releaseDate)}</div></div>
                <div class="spec-item"><div class="spec-label">大小</div><div class="spec-value">${sanitizeHTML(game.specs.size)}</div></div>
                <div class="spec-item"><div class="spec-label">语言</div><div class="spec-value">${sanitizeHTML(game.specs.language)}</div></div>
                <div class="spec-item"><div class="spec-label">玩家人数</div><div class="spec-value">${sanitizeHTML(game.specs.players)}</div></div>
                <div class="spec-item"><div class="spec-label">评价</div><div class="spec-value">${sanitizeHTML(game.specs.rating)}</div></div>
            `;
            
            document.getElementById('compareModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            document.getElementById('compareModal').style.display = 'none';
            document.body.style.overflow = '';
        }
        
        function searchGames() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderGames(games);
                document.getElementById('suggestions').classList.remove('active');
                return;
            }
            const results = games.filter(game => 
                game.name.toLowerCase().includes(query) || 
                game.nameEn.toLowerCase().includes(query) ||
                game.brand.toLowerCase().includes(query)
            );
            renderGames(results);
        }
        
        function showSuggestions() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const suggestions = document.getElementById('suggestions');
            if (!query) {
                suggestions.classList.remove('active');
                return;
            }
            const matches = games.filter(game => 
                game.name.toLowerCase().includes(query) || 
                game.nameEn.toLowerCase().includes(query)
            ).slice(0, 8);
            
            if (matches.length === 0) {
                suggestions.classList.remove('active');
                return;
            }
            
            let html = '';
            matches.forEach(game => {
                const imageUrl = validateImageURL(game.image) ? game.image : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22%3E%3Crect fill=%22%23eee%22 width=%2260%22 height=%2260%22/%3E%3C/svg%3E';
                html += `
                    <div class="suggestion-item" onclick="selectSuggestion('${sanitizeHTML(game.name)}')">
                        <img src="${imageUrl}" alt="${sanitizeHTML(game.name)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22%3E%3Crect fill=%22%23eee%22 width=%2260%22 height=%2260%22/%3E%3C/svg%3E'">
                        <div class="suggestion-info">
                            <h4>${sanitizeHTML(game.name)}</h4>
                            <p>${sanitizeHTML(game.nameEn)}</p>
                            <p>${sanitizeHTML(game.brand)}</p>
                        </div>
                    </div>
                `;
            });
            suggestions.innerHTML = html;
            suggestions.classList.add('active');
        }
        
        function selectSuggestion(name) {
            document.getElementById('searchInput').value = name;
            document.getElementById('suggestions').classList.remove('active');
            searchGames();
        }
        
        function refreshPrices() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('refreshing');
            btn.innerHTML = '<span>⏳</span><span>刷新中...</span>';
            
            setTimeout(() => {
                btn.classList.remove('refreshing');
                btn.innerHTML = '<span>🔄</span><span>刷新价格</span>';
                document.getElementById('lastRefresh').textContent = `价格数据更新于: ${new Date().toLocaleString('zh-CN')}`;
                renderGames(games);
            }, 1500);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            renderGames(games);
            document.getElementById('lastRefresh').textContent = `价格数据更新于: ${new Date().toLocaleString('zh-CN')}`;
            
            document.getElementById('searchBtn').addEventListener('click', searchGames);
            document.getElementById('searchInput').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') searchGames();
                else showSuggestions();
            });
            document.getElementById('closeBtn').addEventListener('click', closeModal);
            document.getElementById('compareModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('compareModal')) closeModal();
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrapper')) {
                    document.getElementById('suggestions').classList.remove('active');
                }
            });
        });
    </script>
