        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .header {
            background-color: #1a1a2e;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 26px;
            color: #e94560;
            margin-bottom: 0;
            flex: 1;
        }
        .refresh-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #refreshBtn {
            padding: 8px 16px;
            font-size: 13px;
            background-color: #0f3460;
            color: white;
            border: 2px solid #16213e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #refreshBtn:hover {
            background-color: #16213e;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #refreshBtn.refreshing {
            background-color: #e94560;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        #lastRefresh {
            font-size: 12px;
            color: #fff;
            background: rgba(255,255,255,0.1);
            padding: 6px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }
        .search-wrapper {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            position: relative;
        }
        .search-container {
            display: flex;
            gap: 10px;
        }
        #searchInput {
            flex: 1;
            padding: 14px 20px;
            font-size: 15px;
            border: 3px solid #0f3460;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
        }
        #searchInput:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.2);
        }
        #searchBtn {
            padding: 14px 30px;
            font-size: 15px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        #searchBtn:hover {
            background-color: #c73e54;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
        }
        .suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 20px;
            right: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .suggestions.active {
            display: block;
        }
        .suggestion-item {
            padding: 12px;
            cursor: pointer;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .suggestion-item:hover {
            background: #f0f0f0;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }
        .suggestion-info {
            flex: 1;
        }
        .suggestion-info h4 {
            margin-bottom: 4px;
            color: #1a1a2e;
            font-size: 14px;
        }
        .suggestion-info p {
            margin: 2px 0;
            font-size: 12px;
            color: #666;
        }
        .game-grid {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }
        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #1a1a2e;
        }
        .game-card-content {
            padding: 15px;
        }
        .game-card h3 {
            font-size: 15px;
            margin-bottom: 4px;
            color: #1a1a2e;
            line-height: 1.4;
        }
        .game-card .name-en {
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
            font-style: italic;
        }
        .game-card .brand {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
        .prices-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .price-item-small {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            padding: 3px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .price-item-small:last-child {
            border-bottom: none;
        }
        .price-item-small .platform {
            font-weight: bold;
            color: #444;
        }
        .price-item-small .prices {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .price-item-small .original {
            color: #999;
            text-decoration: line-through;
        }
        .price-item-small .current {
            color: #e94560;
            font-weight: bold;
            font-size: 11px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 850px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .modal-header img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);

            color: white;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .modal-header-info .name-en {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }

            font-size: 13px;
        }

            color: #555;
            margin-bottom: 25px;
            line-height: 1.7;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 25px;

            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s;

        .price-item:hover {

        }

            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1a1a2e;
        }

            font-weight: bold;
            color: #e94560;
            margin-bottom: 6px;
        }
        .price-item .price-original {

            color: #999;
            text-decoration: line-through;
            margin-bottom: 10px;

            padding: 6px 16px;
            background: #0f3460;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            transition: all 0.3s;
        }
        .price-item .buy-btn:hover {
            background: #16213e;
            transform: scale(1.05);
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .spec-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }
        .spec-item .spec-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .spec-item .spec-value {
            font-size: 13px;
            font-weight: bold;
            color: #1a1a2e;
        }

            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 35px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

            background: rgba(255,255,255,0.2);
            transform: rotate(90deg);
        }
        .no-results {
            text-align: center;
            padding: 50px 20px;
            font-size: 16px;
            color: #999;
            grid-column: 1 / -1;
        }
        .stats-bar {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-bar p {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

        ];
        
        // 初始化页面
        function init() {
            renderGames(games);
            updateTotalCount();
            updateLastRefresh();
            setupSearch();
            setupModal();
        }
        
        // 渲染游戏卡片
        function renderGames(gameList) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            if (gameList.length === 0) {
                grid.innerHTML = '<div class="no-results">没有找到匹配的游戏</div>';
                return;
            }
            
            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openModal(game);
                
                const pricesHTML = `
                    <div class="prices-row">
                        <div class="price-item-small">
                            <span class="platform">Steam</span>
                            <span class="prices">
                                ${game.prices.steamOriginal !== game.prices.steam && game.prices.steamOriginal !== '-' ? `<span class="original">¥${game.prices.steamOriginal}</span>` : ''}
                                <span class="current">¥${game.prices.steam}</span>
                            </span>
                        </div>
                        <div class="price-item-small">
                            <span class="platform">Epic</span>
                            <span class="prices">
                                ${game.prices.epic !== '暂无' && game.prices.epicOriginal !== game.prices.epic && game.prices.epicOriginal !== '-' ? `<span class="original">¥${game.prices.epicOriginal}</span>` : ''}
                                <span class="current">${game.prices.epic === '暂无' ? '暂无' : '¥' + game.prices.epic}</span>
                            </span>
                        </div>
                        <div class="price-item-small">
                            <span class="platform">SteamPY</span>
                            <span class="prices">
                                ${game.prices.steampyOriginal !== game.prices.steampy ? `<span class="original">¥${game.prices.steampyOriginal}</span>` : ''}
                                <span class="current">¥${game.prices.steampy}</span>
                            </span>
                        </div>
                        <div class="price-item-small">
                            <span class="platform">SteamCICI</span>
                            <span class="prices">
                                ${game.prices.steamciciOriginal !== game.prices.steamcici ? `<span class="original">¥${game.prices.steamciciOriginal}</span>` : ''}
                                <span class="current">¥${game.prices.steamcici}</span>
                            </span>
                        </div>
                    </div>
                `;
                
                card.innerHTML = `
                    <img src="${game.image}" alt="${game.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 170%22><rect fill=%22%231a1a2e%22 width=%22300%22 height=%22170%22/><text x=%22150%22 y=%2285%22 text-anchor=%22middle%22 fill=%22%23e94560%22 font-size=%2220%22>游戏封面</text></svg>'">
                    <div class="game-card-content">
                        <h3>${game.name}</h3>
                        <div class="name-en">${game.nameEn}</div>
                        <div class="brand">${game.brand}</div>
                        ${pricesHTML}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // 更新游戏总数
        function updateTotalCount() {
            document.getElementById('totalCount').textContent = `共收录 ${games.length} 款游戏`;
        }
        
        // 更新最后刷新时间
        function updateLastRefresh() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN');
            document.getElementById('lastRefresh').textContent = `价格数据更新于: ${timeStr}`;
        }
        
        // 设置搜索功能
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const suggestions = document.getElementById('suggestions');
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (query.length === 0) {
                    suggestions.classList.remove('active');
                    renderGames(games);
                    return;
                }
                
                const results = games.filter(game => 
                    game.name.toLowerCase().includes(query) || 
                    game.nameEn.toLowerCase().includes(query) ||
                    game.brand.toLowerCase().includes(query)
                );
                
                renderSuggestions(results);
                renderGames(results);
            });
            
            searchBtn.addEventListener('click', () => {
                const query = searchInput.value.toLowerCase().trim();
                if (query.length === 0) {
                    renderGames(games);
                    return;
                }
                
                const results = games.filter(game => 
                    game.name.toLowerCase().includes(query) || 
                    game.nameEn.toLowerCase().includes(query) ||
                    game.brand.toLowerCase().includes(query)
                );
                
                renderGames(results);
                suggestions.classList.remove('active');
            });
            
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrapper')) {
                    suggestions.classList.remove('active');
                }
            });
        }
        
        // 渲染搜索建议
        function renderSuggestions(gameList) {
            const suggestions = document.getElementById('suggestions');
            suggestions.innerHTML = '';
            
            if (gameList.length === 0) {
                suggestions.classList.remove('active');
                return;
            }
            
            gameList.slice(0, 8).forEach(game => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                item.onclick = (e) => {
                    e.stopPropagation();
                    openModal(game);
                    document.getElementById('suggestions').classList.remove('active');
                };
                
                item.innerHTML = `
                    <img src="${game.image}" alt="${game.name}">
                    <div class="suggestion-info">
                        <h4>${game.name}</h4>
                        <p>${game.nameEn}</p>
                        <p>¥${game.prices.steam}</p>
                    </div>
                `;
                
                suggestions.appendChild(item);
            });
            
            suggestions.classList.add('active');
        }
        
        // 设置模态框
        function setupModal() {
            const modal = document.getElementById('compareModal');
            const closeBtn = document.getElementById('closeBtn');
            
            closeBtn.onclick = () => {
                modal.style.display = 'none';
            };
            
            modal.onclick = (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            };
        }
        
        // 打开游戏详情模态框
        function openModal(game) {
            const modal = document.getElementById('compareModal');
            
            document.getElementById('modalGameImage').src = game.image;
            document.getElementById('modalGameName').textContent = game.name;
            document.getElementById('modalGameNameEn').textContent = game.nameEn;
            document.getElementById('modalGameBrand').textContent = game.brand;
            document.getElementById('modalGameDesc').textContent = game.description;
            
            // 渲染价格对比
            const priceComparison = document.getElementById('priceComparison');
            const platforms = [
                { name: 'Steam', price: game.prices.steam, original: game.prices.steamOriginal, link: game.prices.steamLink },
                { name: 'Epic', price: game.prices.epic, original: game.prices.epicOriginal, link: game.prices.epicLink }
            ];
            
            if (game.prices.steampy) {
                platforms.push({ name: 'SteamPY', price: game.prices.steampy, original: game.prices.steampyOriginal, link: game.prices.steampyLink });
            }
            if (game.prices.steamcici) {
                platforms.push({ name: 'SteamCICI', price: game.prices.steamcici, original: game.prices.steamciciOriginal, link: game.prices.steamciciLink });
            }
            
            priceComparison.innerHTML = platforms.map(p => `
                <div class="price-item">
                    <div class="platform">${p.name}</div>
                    <div class="price-value">${p.price === '暂无' ? '暂无' : '¥' + p.price}</div>
                    ${p.original && p.original !== '-' && p.original !== p.price ? `<div class="price-original">¥${p.original}</div>` : ''}
                    ${p.price !== '暂无' ? `<a href="${p.link}" target="_blank" class="buy-btn">购买</a>` : ''}
                </div>
            `).join('');
            
            // 渲染游戏规格
            const specsGrid = document.getElementById('specsGrid');
            specsGrid.innerHTML = Object.entries(game.specs).map(([key, value]) => {
                const labels = {
                    genre: '游戏类型',
                    releaseDate: '发售日期',
                    size: '游戏大小',
                    language: '支持语言',
                    players: '玩家人数',
                    rating: '用户评分'
                };
                return `
                    <div class="spec-item">
                        <div class="spec-label">${labels[key] || key}</div>
                        <div class="spec-value">${value}</div>
                    </div>
                `;
            }).join('');
            
            modal.style.display = 'flex';
        }
        
        // 刷新价格
        function refreshPrices() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('refreshing');
            btn.disabled = true;
            
            // 模拟刷新
            setTimeout(() => {
                updateLastRefresh();
                btn.classList.remove('refreshing');
                btn.disabled = false;
            }, 1000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
